/**:
  camera:
    ros__parameters:
      enable_color: true
      rgb_camera:
        profile: '640,480,60'
        enable_auto_exposure: false
      depth_module:
        profile: '640,480,60'
        enable_auto_exposure: false
      enable_depth: true
      enable_infra: false
      enable_infra1: false
      enable_infra2: false

$(var cam_high_name):
  camera:
    ros__parameters:
      serial_no: "230322275509"
      enable_depth: true
      enable_color: true

$(var cam_right_wrist_name):
  camera:
    ros__parameters:
      serial_no: "218622272634"

$(var cam_left_wrist_name):
  camera:
    ros__parameters:
      serial_no: "218622275913"

$(var cam_pov_name):
  camera:
    ros__parameters:
      serial_no: "939622075315"
      rgb_camera:
        profile: '640,480,15'
      enable_depth: false
      enable_gyro: false
      enable_accel: false
