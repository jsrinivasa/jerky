# Named poses for autonomous navigation.
# Coordinates are in the *map* frame (meters, yaw in radians).
#
# How to record a pose:
#   1. Launch navigate_mission.launch.py with the correct map
#   2. Manually drive the robot to the exact location
#   3. Run:  ros2 run tf2_ros tf2_echo map base_link
#   4. Copy Translation (x, y) and RPY radian yaw (3rd value) below
#
# How to navigate to a pose (handles map selection automatically):
#   ros2 launch aloha go_to_pose.launch.py pose_name:=elevator
#   ros2 launch aloha go_to_pose.launch.py pose_name:=conference_room
#   ros2 launch aloha go_to_pose.launch.py pose_name:=team_room_31
#   ros2 launch aloha go_to_pose.launch.py pose_name:=parking

